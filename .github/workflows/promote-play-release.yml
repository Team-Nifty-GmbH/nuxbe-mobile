name: Promote Play Release

on:
  workflow_dispatch:
    inputs:
      release_status:
        description: 'Release status after promotion'
        required: true
        type: choice
        options:
          - completed
          - draft
        default: completed

jobs:
  promote:
    name: Promote internal build to production
    runs-on: [self-hosted, Linux]
    env:
      PATH: /usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install fastlane (system Ruby)
        working-directory: android
        run: |
          bundle config set --local path vendor/bundle
          bundle install

      - name: Promote to production
        working-directory: android
        run: |
          export PLAY_STORE_SERVICE_ACCOUNT_JSON_PATH="$RUNNER_TEMP/play-store-key.json"
          echo '${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}' > "$PLAY_STORE_SERVICE_ACCOUNT_JSON_PATH"
          trap 'rm -f "$PLAY_STORE_SERVICE_ACCOUNT_JSON_PATH"' EXIT
          bundle exec fastlane android promote
        env:
          RELEASE_STATUS: ${{ inputs.release_status }}
