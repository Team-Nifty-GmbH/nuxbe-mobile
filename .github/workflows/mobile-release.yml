name: Mobile App Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'mobile-v*.*.*'

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  prepare:
    name: Build Web Assets & Version
    runs-on: [self-hosted, Linux]
    container:
      image: cimg/android:2026.03.1-node
      options: --user root
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      build_number: ${{ steps.version.outputs.build_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      # Computed once and handed to both build jobs. Deriving it separately per
      # job gave iOS and Android different build numbers for the same release.
      - name: Compute version and build number
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          VERSION=${VERSION#mobile-v}
          VERSION=$(echo "$VERSION" | sed 's/-.*//')
          BUILD_NUMBER=$(( $(date +%s) / 60 ))
          echo "app_version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "App version: $VERSION, Build number: $BUILD_NUMBER"

      - name: Return workspace ownership to the runner
        if: always()
        run: chown -R 1000:1000 "$GITHUB_WORKSPACE" || true

  build-ios:
    name: Build iOS
    needs: prepare
    runs-on: [self-hosted, macOS, ARM64]
    env:
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/App

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create Google Services file
        working-directory: ios/App
        run: echo '${{ secrets.IOS_GOOGLE_SERVICES_PLIST }}' > GoogleService-Info.plist

      - name: Store App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo '${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}' | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      # build:ios already runs `cap sync ios`, so no separate sync step.
      - name: Build web assets and sync
        run: npm run build:ios

      - name: Build with Fastlane
        working-directory: ios/App
        env:
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          APP_VERSION: ${{ env.APP_VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_PATH: ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane ios build_with_match

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-app
          path: ios/App/build/*.ipa
          retention-days: 30

  build-android:
    name: Build Android
    needs: prepare
    runs-on: [self-hosted, Linux]
    container:
      image: cimg/android:2026.03.1-node
      options: --user root
    env:
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Create Google Services file
        working-directory: android/app
        run: echo '${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}' | base64 --decode > google-services.json

      - name: Create Keystore
        working-directory: android/app
        run: echo '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 --decode > release.keystore

      - name: Create keystore.properties
        working-directory: android
        run: |
          printf '%s\n' \
            "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" \
            "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" \
            "storeFile=release.keystore" \
            > keystore.properties

      # build:android already runs `cap sync android`, so no separate sync step.
      - name: Build web assets and sync
        run: npm run build:android

      - name: Build AAB and APK
        working-directory: android
        run: |
          ./gradlew bundleRelease -PappVersionName=${{ env.APP_VERSION }} -PappVersionCode=${{ env.BUILD_NUMBER }}
          ./gradlew assembleRelease -PappVersionName=${{ env.APP_VERSION }} -PappVersionCode=${{ env.BUILD_NUMBER }}

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Return workspace ownership to the runner
        if: always()
        run: chown -R 1000:1000 "$GITHUB_WORKSPACE" || true

  create-release:
    name: Create GitHub Release
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download iOS Artifact
        uses: actions/download-artifact@v8
        with:
          name: ios-app
          path: artifacts/ios

      - name: Download Android AAB
        uses: actions/download-artifact@v8
        with:
          name: android-aab
          path: artifacts/android

      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: artifacts/android

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/ios/*.ipa
            artifacts/android/*.aab
            artifacts/android/*.apk
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
