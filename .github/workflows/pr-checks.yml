name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build Web Assets
    runs-on: [self-hosted, Linux]
    container:
      image: cimg/android:2026.03.1-node
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      # This job runs in a root container, so every file it writes into the
      # shared runner workspace is root-owned. A later host-side job then fails
      # `git clean` with EACCES. Hand the workspace back to the runner user
      # (uid/gid 1000) so it stays cleanable.
      - name: Return workspace ownership to the runner
        if: always()
        run: chown -R 1000:1000 "$GITHUB_WORKSPACE" || true

  build-android:
    name: Build Android (debug)
    runs-on: [self-hosted, Linux]
    container:
      image: cimg/android:2026.03.1-node
      options: --user root
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync
        run: npm run build:android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Return workspace ownership to the runner
        if: always()
        run: chown -R 1000:1000 "$GITHUB_WORKSPACE" || true
