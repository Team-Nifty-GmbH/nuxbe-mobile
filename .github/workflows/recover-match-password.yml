name: recover-match-password
on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: 'GPG passphrase to encrypt the export'
        required: true
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: encrypt MATCH_PASSWORD
        env:
          MP: ${{ secrets.MATCH_PASSWORD }}
        run: |
          printf '%s' "$MP" > match_password
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "${{ inputs.passphrase }}" -o match_password.gpg match_password
      - uses: actions/upload-artifact@v4
        with:
          name: match-password
          path: match_password.gpg
          retention-days: 1
